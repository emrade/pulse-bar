name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Clean and Build
      run: |
        # Clean previous builds
        rm -rf DerivedData
        rm -rf PulseBar.app
        rm -rf *.zip
        
        # Build Release configuration with ad-hoc signing
        xcodebuild -project PulseBar.xcodeproj \
          -scheme PulseBar \
          -configuration Release \
          -derivedDataPath ./DerivedData \
          clean build
          
        # Copy app to root for packaging
        cp -r DerivedData/Build/Products/Release/PulseBar.app .
        
    - name: Create ZIP package
      run: |
        # Get version from tag (remove 'v' prefix)
        VERSION=${GITHUB_REF_NAME#v}
        
        # Create distribution ZIP
        ditto -c -k --sequesterRsrc --keepParent \
          PulseBar.app \
          "PulseBar-v${VERSION}.zip"
          
        # Verify package
        echo "ZIP package created: PulseBar-v${VERSION}.zip"
        ls -lh "PulseBar-v${VERSION}.zip"
        
    - name: Test app signature
      run: |
        codesign -vv PulseBar.app
        echo "✅ App signature valid"
        
    - name: Generate release notes
      id: release_notes
      run: |
        # Get commits since last tag for release notes
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          COMMITS=$(git log --oneline $LAST_TAG..HEAD --pretty=format:"- %s")
        else
          COMMITS=$(git log --oneline --pretty=format:"- %s" | head -10)
        fi
        
        # Create release notes
        cat > release_notes.md << EOF
        ## What's Changed
        
        ${COMMITS}
        
        ## Installation
        
        1. **Download**: Click on \`PulseBar-v${GITHUB_REF_NAME#v}.zip\` below
        2. **Extract**: Double-click the ZIP file to extract \`PulseBar.app\`  
        3. **Install**: Drag \`PulseBar.app\` to your Applications folder
        4. **Launch**: Open PulseBar from Applications or Spotlight
        5. **First Run**: macOS may show a security dialog - click "Open" to continue
        6. **Permissions**: Grant requested permissions for full functionality
        
        ## System Requirements
        
        - macOS 12.0 or later
        - Apple Silicon (M1/M2/M3) or Intel Mac
        
        ## Open Source
        
        PulseBar is open source software distributed under the MIT license. 
        Since this app is not notarized, macOS will show a security warning on first launch.
        This is normal for open source apps distributed outside the App Store.
        
        **To install**: Right-click the app and select "Open" if you see a security warning.
        EOF
        
        echo "release_notes<<EOF" >> $GITHUB_OUTPUT
        cat release_notes.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: PulseBar-v*.zip
        body: ${{ steps.release_notes.outputs.release_notes }}
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: PulseBar-${{ github.ref_name }}
        path: |
          PulseBar-v*.zip
          PulseBar.app